[package]
name = "bch-light-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "A Bitcoin Cash light client library: block headers, script filters (filter type 1) and whole blocks over the P2P protocol, with no index"

[dependencies]
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "sync"] }
tracing = "0.1"

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
